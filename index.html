<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <h1> Perfume do China</h1>
        </div>
        <nav class="filtros">
            <input type="text" id="busca" placeholder="Pesquisar produto...">
            <select id="marca">
                <option value="">Todas as marcas</option>
            </select>
            <select id="ordenar">
                <option value="">Ordenar</option>
                <option value="nome">Nome de A a Z</option>
                <option value="menor">Menor Preço</option>
                <option value="maior">Maior Preço</option>
            </select>
        </nav>
    </header>
    <main>
        <section class="banner">
            <h1>Melhores promos do china</h1>
            <hr>
        </section>
        <section id="produtos">

        </section>
        <nav id="paginacao">

        </nav>
    </main>
    <footer>
        <ul>
            <li><a href="#">Termos de Uso</a></li>
            <li><a href="#">Política de Privacidade</a></li>
        </ul>
        <p>Nao tem galantia</p>
        <p>&copy;2026. Minha Loja. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
